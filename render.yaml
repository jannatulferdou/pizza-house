services:
  - type: web
    name: pizza-house-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/pizza-house.sqlite
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: pizza-house-data
      mountPath: /var/data
      sizeGB: 1
